name: Build and deploy to Amazon ECS (Manual Reference)

# DISABLED AUTOMATIC TRIGGER:
# Automatic ECS deployment on push to main is disabled because IAM OIDC Identity Providers
# are unavailable on the AWS Free plan without activating advanced features/account upgrade.
# This workflow and .aws/task-definition.json are preserved for architectural reference.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Test, publish, and deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_EXECUTION_ROLE_ARN: ${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}
      TASK_DEFINITION: .aws/task-definition.json
      CONTAINER_NAME: calculator

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test and package
        run: mvn -B verify

      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE ECS_TASK_EXECUTION_ROLE_ARN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the GitHub Actions variable ${name} before deploying."
              exit 1
            fi
          done

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare task definition
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECS_TASK_EXECUTION_ROLE_ARN: ${{ env.ECS_TASK_EXECUTION_ROLE_ARN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          template = Path(os.environ["TASK_DEFINITION"])
          rendered = template.read_text(encoding="utf-8")
          rendered = rendered.replace("${AWS_REGION}", os.environ["AWS_REGION"])
          rendered = rendered.replace(
              "${ECS_TASK_EXECUTION_ROLE_ARN}",
              os.environ["ECS_TASK_EXECUTION_ROLE_ARN"],
          )
          Path(".aws/task-definition.rendered.json").write_text(rendered, encoding="utf-8")
          PY

      - name: Render image into task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/task-definition.rendered.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy task definition to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
