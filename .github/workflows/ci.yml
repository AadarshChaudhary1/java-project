name: Java CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, package Lambda, and validate Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test and package application & Lambda artifact
        run: mvn -B clean verify -P lambda

      - name: Build Docker image
        run: docker build --tag calculator:ci .

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload Lambda deployment package
        uses: actions/upload-artifact@v4
        with:
          name: java-calculator-lambda-package
          path: target/java-project-1.0.0-lambda.jar
          if-no-files-found: error
